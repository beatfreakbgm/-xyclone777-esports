<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xyclone Esports</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #0f0f0f; color: #fff; padding: 20px; }
        .card { background: #1a1a1a; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
        img { width: 100%; border-radius: 8px; margin-bottom: 15px; }
        h1 { color: #ff4757; }
    </style>
</head>
<body>
    <div class="card">
        <img id="displayPoster" src="" alt="Tournament Poster">
        <h1 id="displayName">Loading...</h1>
        <p><strong>Entry Fee:</strong> <span id="displayFee">-</span></p>
        <p><strong>Prize Pool:</strong> <span id="displayPrize">-</span></p>
    </div>

    <script>
        const BIN_ID = "6aae4278ffd5d1605318a997";
        const API_KEY = "$2a$10$ltW6u9G6gqZAFPD5m74pF.W4mX9CuMoVQrFwXDxyM16ddtGtXU6ZG";

        async function fetchData() {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { "X-Master-Key": API_KEY }
                });
                let data = await res.json();
                document.getElementById("displayName").innerText = data.record.tournamentName;
                document.getElementById("displayFee").innerText = data.record.entryFee;
                document.getElementById("displayPrize").innerText = data.record.prizePool;
                if(data.record.poster) {
                    document.getElementById("displayPoster").src = data.record.poster;
                }
            } catch (e) {
                console.log("Error loading data", e);
            }
        }

        fetchData();
    </script>
</body>
</html>
